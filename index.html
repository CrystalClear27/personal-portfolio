        <!---Nina News Section start-->
        <section id="nina-news" class="nina-news">
        <h2>Latest Nina News</h2>
        <div class="news-grid" id="newsGrid">
            <!-- Cards will be inserted dynamically -->
             </section>

            <!-- 1️⃣ Load the data file -->
            <script src="news.js"></script>

            <!-- 2️⃣ Load the rendering logic -->
            <script>
            // Wait until the DOM is ready
            document.addEventListener("DOMContentLoaded", () => {
                const grid = document.getElementById("newsGrid");

                // Sort by date (newest first)
                const sorted = newsData
                .slice() // make a copy
                .sort((a, b) => new Date(b.date) - new Date(a.date));

                // Limit to 2
                const latestTwo = sorted.slice(0, 2);

                // Render
                latestTwo.forEach(item => {
                const card = document.createElement("div");
                card.classList.add("news-card");
                card.innerHTML = `
                    <img src="${item.image}" alt="${item.title}">
                    <h3>${item.title}</h3>
                    <p><strong>${item.date}</strong></p>
                    <p>${item.excerpt}</p>
                    <a href="${item.link}">Read more →</a>
                `;
                grid.appendChild(card);
                });
            });
            </script>
        </div>



    </body>
